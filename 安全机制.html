      </p>

    <section class="security-summary">

      <div class="summary-card">

        </div>

      >

      </button>

      <button

        @click="nextStep"
        :disabled="currentStep === steps.length - 1"
      >
        {{
          currentStep === -1
            ? "开始演示"
            : currentStep === steps.length - 1
            ? "迁移完成"
            : "下一步"

<script setup>
import { ref, computed, onUnmounted } from "vue";

/*
 * 当前迁移步骤
 *
 * -1 表示还没有开始。
 */
const currentStep = ref(-1);

const autoPlaying = ref(false);

let timer = null;


/*
 * 原生 TLS 安全热迁移过程
 */
const steps = [

  {
    title: "加载 TLS 凭据",

    description:
      "源端和目标端 QEMU 加载 TLS Credentials 和 X.509 证书，为建立安全迁移连接做准备。",

    progress: 5,

    payload: ""
  },

  {
    title: "TLS Handshake",

    description:
      "源 QEMU 与目标 QEMU 开始 TLS 握手，交换建立安全连接所需的信息。",

    progress: 12,

    payload: "TLS Handshake Messages"
  },

  {
    title: "X.509 身份认证",

    description:
      "双方验证证书信任关系、证书有效性以及目标主机身份，防止迁移连接到伪造目标节点。",

    progress: 18,

    payload: "X.509 Certificate"
  },

  {
    title: "密钥与密码套件协商",

    description:
      "TLS 协商密码套件并生成会话密钥。后续大量迁移数据使用高效的对称密码机制进行保护。",

    progress: 25,

    payload: "TLS Session Key"
  },

  {
    title: "TLS 安全迁移通道建立",

    description:
      "身份认证和密钥协商完成，源 QEMU 与目标 QEMU 之间建立受 TLS 保护的 Migration Channel。",

    progress: 30,

    payload: "Encrypted Migration Channel"
  },

  {
    title: "内存预拷贝",

    description:
      "虚拟机继续在源端运行，QEMU 将 RAM Pages 持续发送到目标端。迁移数据经过 TLS 加密和完整性保护。",

    progress: 65,

    payload: "RAM Pages"
  },

  {
    title: "脏页迭代迁移",

    description:
      "虚拟机运行过程中产生新的 Dirty Pages，QEMU 持续将脏页通过 TLS 安全通道发送到目标节点。",

    progress: 82,

    payload: "Dirty Memory Pages"
  },

  {
    title: "Stop-and-Copy",

    description:
      "源虚拟机短暂停止运行，QEMU 发送最后的内存页、CPU 寄存器以及设备状态。",

    progress: 95,

    payload: "Final RAM + CPU State + Device State"
  },

  {
    title: "目标虚拟机恢复",

    description:
      "目标 QEMU 完成虚拟机状态恢复并启动虚拟机，安全热迁移完成。",

    progress: 100,

    payload: "Migration Complete"
  }

];


/*
 * 安全机制
 */
const securitySteps = computed(() => [

  {
    name: "X.509 身份认证",

    description: "验证迁移双方身份",

    completed: currentStep.value >= 2
  },

  {
    name: "TLS 密钥协商",

    description: "建立会话密钥",

    completed: currentStep.value >= 3
  },

  {
    name: "加密通道",

    description: "保护 Migration Stream",

    completed: currentStep.value >= 4
  },

  {
    name: "完整性保护",

    description: "检测数据篡改",

    completed: currentStep.value >= 4
  }

]);


/*
 * 是否加载 TLS Credentials
 */
const tlsLoaded = computed(() => {

  return currentStep.value >= 0;

});


/*
 * 是否正在迁移数据
 */
const migrationStarted = computed(() => {

  return currentStep.value >= 4;

});


/*
 * 当前进度
 */
const progress = computed(() => {

  if (currentStep.value === -1) {

    return 0;

  }

  return steps[currentStep.value].progress;

});


/*
 * 当前数据类型
 */
const currentPayload = computed(() => {

  if (currentStep.value === -1) {

    return "";

  }

  return steps[currentStep.value].payload;

});


/*
 * 安全通道状态
 */
const channelStatus = computed(() => {

  if (currentStep.value < 1) {

    return "等待建立连接";

  }

  if (currentStep.value < 4) {

    return "TLS 握手中";

  }

  if (currentStep.value === steps.length - 1) {

    return "✓ 安全迁移完成";

  }

  return "🔒 TLS 安全通道已建立";

});


/*
 * 源虚拟机状态
 */
const sourceState = computed(() => {

  if (currentStep.value === 7) {

    return "已暂停";

  }

  if (currentStep.value === 8) {

    return "迁移完成";

  }

  return "运行中";

});


/*
 * 目标虚拟机状态
 */
const targetState = computed(() => {

  if (currentStep.value < 5) {

    return "等待迁移";

  }

  if (currentStep.value < 8) {

    return "正在恢复状态";

  }

  return "运行中";

});


/*
 * 下一步
 */
function nextStep() {

  if (currentStep.value < steps.length - 1) {

    currentStep.value++;

  }

  if (currentStep.value === steps.length - 1) {

    stopAutoPlay();

  }

}


/*
 * 自动演示
 */
function autoPlay() {

  if (autoPlaying.value) {

    stopAutoPlay();

    return;

  }


  if (currentStep.value === steps.length - 1) {

    currentStep.value = -1;

  }


  autoPlaying.value = true;


  nextStep();


  timer = setInterval(() => {

    if (currentStep.value >= steps.length - 1) {

      stopAutoPlay();

      return;

    }

    nextStep();

  }, 2200);

}


/*
 * 停止自动播放
 */
function stopAutoPlay() {

  if (timer) {

    clearInterval(timer);

    timer = null;

  }

  autoPlaying.value = false;

}


/*
 * 重置
 */
function resetMigration() {

  stopAutoPlay();

  currentStep.value = -1;

}


/*
 * 组件卸载时清除定时器
 */
onUnmounted(() => {

  stopAutoPlay();

});
</script>
